name: core

on:
  push:
    branches: [main, arena/01a05bbd-waybound]
  pull_request:

jobs:
  test:
    # The pure core (WayboundCore SPM package): no Apple frameworks, so it
    # builds and tests on Linux — free, fast, no macOS queue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: swift test
        run: swift test --package-path WayboundCore
