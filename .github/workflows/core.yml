name: core

on:
  push:
    branches: [main, arena/01a0bbc7-waybound]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: swift build (all products)
        run: swift build --package-path WayboundCore

      - name: swift test
        run: swift test --package-path WayboundCore
