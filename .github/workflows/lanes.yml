name: lanes

on:
  push:
    branches: [main, arena/01a05bbd-waybound, arena/01a093c3-waybound]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  harness:
    # The lane harness gates, now plain Swift tests in WayboundCore (the
    # Python mirrors are gone). lane_check renders main vs scheduled
    # ribbons on the downtown scenarios and gates crossings/wobble/
    # separation/kink; lane_fuzz runs 120 seeded random corridors and
    # gates problem-seed count against its pinned baseline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: lane check (scenario gates)
        run: |
          set -o pipefail
          swift test --package-path WayboundCore \
            --filter LaneCheckTests 2>&1 | tee check.log

      - name: scheduler fuzz (seeded, pinned baseline)
        run: |
          set -o pipefail
          swift test --package-path WayboundCore \
            --filter LaneFuzzTests 2>&1 | tee fuzz.log

      - name: report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
                --state open --json number --jq '.[0].number' 2>&1 || true)
          case "$n" in
            ''|*[!0-9]*) n=$(gh pr list --repo "$GITHUB_REPOSITORY" \
                              --head "$branch" --state all \
                              --json number --jq '.[0].number' 2>/dev/null || true);;
          esac
          {
            echo "## lanes — run ${GITHUB_RUN_NUMBER} (\`${GITHUB_SHA:0:7}\`, branch ${branch})"
            echo
            echo '```'
            grep -hE 'LANE-CHECK|LANE-FUZZ' check.log fuzz.log \
              | head -70 || echo "(no lane lines)"
            echo '```'
            echo
            if grep -h 'error:' check.log fuzz.log | head -1 > /dev/null; then
              echo "### compiler/test errors"
              echo '```'
              grep -h 'error:' check.log fuzz.log | sort -u | head -30
              echo '```'
            fi
            echo '```'
            tail -n 4 fuzz.log
            echo '```'
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$n" ]; then
            gh pr comment "$n" --repo "$GITHUB_REPOSITORY" --edit-last \
              --body-file report.md --create-if-none \
              || echo "(could not post PR comment)"
          else
            echo "(no PR found for branch ${branch}; report left in the step summary)"
          fi
