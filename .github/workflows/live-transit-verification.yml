name: live-transit-verification

on:
  workflow_dispatch:
    inputs:
      areas:
        description: "One NAME=LAT,LON area per line (or bare LAT,LON)"
        required: false
        default: "Santa Barbara=34.4209,-119.7033"
        type: string
      date:
        description: "Service day YYYY-MM-DD; blank uses today's live window"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

# Live Transitland is an external, rate-limited verification job. A second
# manual run or the nightly run must not continue beside the first one.
concurrency:
  group: waybound-live-transitland
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Select areas
        env:
          DISPATCH_AREAS: ${{ inputs.areas }}
        run: |
          set -eu
          if [ -n "${DISPATCH_AREAS}" ]; then
            printf '%s\n' "${DISPATCH_AREAS}" > areas.txt
          else
            cat > areas.txt <<'EOF'
          Santa Barbara=34.4209,-119.7033
          San Francisco=37.7749,-122.4194
          EOF
          fi
          printf 'areas:\n'
          cat areas.txt

      - name: Set snapshot date
        id: date
        env:
          DISPATCH_DATE: ${{ inputs.date }}
        run: |
          if [ -n "${DISPATCH_DATE}" ]; then
            echo "date=${DISPATCH_DATE}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore raw Transitland snapshots
        uses: actions/cache@v4
        with:
          path: .transitland-cache
          key: transitland-snapshots-${{ steps.date.outputs.date }}-${{ hashFiles('areas.txt') }}
          restore-keys: |
            transitland-snapshots-${{ steps.date.outputs.date }}-

      - name: Fetch and verify sequentially
        env:
          TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
        run: |
          swift run --package-path WayboundCore --configuration release \
            waybound-transit-verify \
            --areas-file areas.txt \
            --date "${{ steps.date.outputs.date }}" \
            --cache-dir .transitland-cache \
            --output-dir verification-output

      - name: Add report to run summary
        if: always()
        run: |
          if [ -f verification-output/report.md ]; then
            cat verification-output/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The verifier did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload snapshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transitland-verification-${{ github.run_number }}
          path: verification-output
          if-no-files-found: warn
          retention-days: 14
